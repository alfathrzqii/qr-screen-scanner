name: Build & Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Decode Keystore from Secret
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Signed Release APK
        run: gradle assembleRelease --stacktrace
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'QrScannerRelease2026!' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'qrscreenscanner' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'QrScannerRelease2026!' }}

      - name: Prepare Release Artifact & Notes
        id: release_info
        run: |
          mkdir -p release-output
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="${{ github.event.inputs.version_name || 'v1.0.0' }}"
          fi
          cp app/build/outputs/apk/release/app-release.apk release-output/QR-Screen-Scanner-${TAG_NAME}.apk

          if [ -f "releases/${TAG_NAME}.md" ]; then
            echo "notes_file=releases/${TAG_NAME}.md" >> $GITHUB_OUTPUT
          elif [ -f "releases/release_notes.md" ]; then
            echo "notes_file=releases/release_notes.md" >> $GITHUB_OUTPUT
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QR-Screen-Scanner-Release-APK
          path: release-output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="${{ github.event.inputs.version_name || 'v1.0.0' }}"
          fi

          NOTES_FILE="releases/${TAG_NAME}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE="releases/release_notes.md"
          fi

          TITLE="QR Screen Scanner ${TAG_NAME}"

          # Delete existing release draft/entry for this tag if already present
          gh release delete "$TAG_NAME" --yes 2>/dev/null || true

          if [ -f "$NOTES_FILE" ]; then
            echo "Publishing release with notes from $NOTES_FILE"
            gh release create "$TAG_NAME" release-output/*.apk \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE"
          else
            echo "Publishing release with auto-generated notes"
            gh release create "$TAG_NAME" release-output/*.apk \
              --title "$TITLE" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
